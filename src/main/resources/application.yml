spring:
  application.name: taskforge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskforge}
    username: ${SPRING_DATASOURCE_USERNAME:taskforge}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  data.redis.host: ${SPRING_DATA_REDIS_HOST:localhost}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: taskforge-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties.max.poll.records: 1
      properties.max.poll.interval.ms: ${TASKFORGE_KAFKA_MAX_POLL_INTERVAL_MS:86520000}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener.ack-mode: manual
  jackson.default-property-inclusion: non_null
server.error.include-message: never
logging.pattern.level: "%5p [requestId:%X{requestId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,broker
  prometheus:
    metrics:
      export:
        enabled: true
springdoc.swagger-ui.path: /swagger-ui.html
taskforge:
  cors:
    allowed-origins: ${TASKFORGE_CORS_ALLOWED_ORIGINS:}
  jwt-secret: ${TASKFORGE_JWT_SECRET}
  jwt-ttl: PT8H
  role: ${TASKFORGE_ROLE:api}
  handler-stop-grace-seconds: ${TASKFORGE_HANDLER_STOP_GRACE_SECONDS:5}
  scheduler-interval: ${TASKFORGE_SCHEDULER_INTERVAL:1000}
  outbox-interval: ${TASKFORGE_OUTBOX_INTERVAL:250}
  outbox-retention-days: ${TASKFORGE_OUTBOX_RETENTION_DAYS:14}
  outbox-retention-interval: ${TASKFORGE_OUTBOX_RETENTION_INTERVAL:21600000}
  outbox-retention-initial-delay: ${TASKFORGE_OUTBOX_RETENTION_INITIAL_DELAY:60000}
  heartbeat-interval: ${TASKFORGE_HEARTBEAT_INTERVAL:5000}
  worker-dead-after-seconds: ${TASKFORGE_WORKER_DEAD_AFTER_SECONDS:20}
  recovery-interval: ${TASKFORGE_RECOVERY_INTERVAL:5000}
  retry:
    base-delay: ${TASKFORGE_RETRY_BASE_DELAY:2}
    max-delay: ${TASKFORGE_RETRY_MAX_DELAY:256}
  kafka:
    topic-partitions: ${TASKFORGE_KAFKA_TOPIC_PARTITIONS:6}
    topic-replication-factor: ${TASKFORGE_KAFKA_TOPIC_REPLICATION_FACTOR:1}
  bootstrap-admin-email: ${TASKFORGE_ADMIN_EMAIL:}
  bootstrap-admin-password: ${TASKFORGE_ADMIN_PASSWORD:}
