name: TaskForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Java 21, Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests and package
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build application image
        run: docker build --pull --tag taskforge:ci .
