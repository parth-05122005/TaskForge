services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: ${DB_USER:-taskforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskforge}"], interval: 5s, timeout: 3s, retries: 20}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
  api:
    build: .
    environment: &app-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskforge
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-taskforge}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TASKFORGE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TASKFORGE_ADMIN_EMAIL: ${TASKFORGE_ADMIN_EMAIL:-}
      TASKFORGE_ADMIN_PASSWORD: ${TASKFORGE_ADMIN_PASSWORD:-}
      TASKFORGE_SCHEDULER_INTERVAL: ${TASKFORGE_SCHEDULER_INTERVAL:-1000}
      TASKFORGE_OUTBOX_INTERVAL: ${TASKFORGE_OUTBOX_INTERVAL:-250}
      TASKFORGE_HEARTBEAT_INTERVAL: ${TASKFORGE_HEARTBEAT_INTERVAL:-5000}
      TASKFORGE_RECOVERY_INTERVAL: ${TASKFORGE_RECOVERY_INTERVAL:-5000}
      TASKFORGE_RETRY_BASE_DELAY: ${TASKFORGE_RETRY_BASE_DELAY:-2}
      TASKFORGE_RETRY_MAX_DELAY: ${TASKFORGE_RETRY_MAX_DELAY:-256}
      TASKFORGE_KAFKA_MAX_POLL_INTERVAL_MS: ${TASKFORGE_KAFKA_MAX_POLL_INTERVAL_MS:-86520000}
      TASKFORGE_ROLE: api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
    ports: ["127.0.0.1:8080:8080"]
  worker:
    build: .
    environment:
      <<: *app-env
      TASKFORGE_ROLE: worker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      kafka: {condition: service_started}
volumes:
  pgdata:
  redisdata:
